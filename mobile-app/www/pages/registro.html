<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Registro</title>

    <link rel="stylesheet"
          href="../css/styles.css">

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <h1>Crear cuenta</h1>

        <p>
            Regístrate para comprar en CERAMISHOP
        </p>

        <input
            type="text"
            id="nombre"
            placeholder="Nombre completo"
        >

        <input
            type="email"
            id="correo"
            placeholder="Correo electrónico"
        >

        <input
            type="password"
            id="password"
            placeholder="Contraseña"
        >

        <button id="btnRegistro">

            Registrarme

        </button>

        <br><br>

        <p class="login-link">

            ¿Ya tienes cuenta?

            <a href="login.html">
                Iniciar sesión
            </a>

        </p>

    </div>

</div>

<script src="../js/toast.js"></script>
<script src="../js/registro.js"></script>

</body>
</html>
