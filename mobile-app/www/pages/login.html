<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#c62828">
    <title>Iniciar sesión | CERAMISHOP</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<main class="login-container">
    <div class="login-card">
        <h1>CERAMISHOP</h1>
        <p>Inicia sesión para continuar</p>
        <div id="mensaje" role="alert" class="mensaje-error" hidden></div>
        <form id="loginForm" novalidate>
            <label for="correo" class="campo-label">Correo electrónico</label>
            <input type="email" id="correo" autocomplete="email" inputmode="email" required>
            <label for="password" class="campo-label">Contraseña</label>
            <input type="password" id="password" autocomplete="current-password" required>
            <button type="submit" id="btnLogin" class="btn-principal">Ingresar</button>
        </form>
        <p class="login-link"><a href="#" id="olvideClave">¿Olvidaste tu contraseña?</a></p>
        <p class="login-link">¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
        <p class="login-link"><a href="../home.html">Ver productos sin iniciar sesión</a></p>
    </div>
</main>

<script src="../js/config.js"></script>
<script src="../js/toast.js"></script>
<script src="../js/api.js"></script>
<script src="../js/util.js"></script>
<script src="../js/login.js"></script>
</body>
</html>
